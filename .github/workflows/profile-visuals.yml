name: Refresh profile visuals

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-stats.svg"
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate warm contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TriIgnis
          outputs: |
            dist/github-contribution-snake.svg?color_snake=%23C97952&color_dots=%23F5EDE3,%23F0DCC9,%23E7C09D,%23D99A70,%23B96F4D

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate GitHub statistics card
        run: python scripts/generate_github_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated statistics card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub profile stats"
          git push
