    <text x="26" y="34" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#A8843F">03  /  MULTIMODAL AGENTS</text>
    <text x="26" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700" fill="#51462F">多模态智能体</text>
    <text x="26" y="108" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#A8843F">Multimodal Agents</text>
