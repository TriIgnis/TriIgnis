  </g>

  <!-- Card 04 -->
  <g transform="translate(562 200)">
    <rect width="526" height="170" rx="18" fill="url(#c4)" stroke="#E6C8BE"/>
    <circle cx="463" cy="40" r="29" fill="#FFFFFF" opacity=".5"/>
    <g transform="translate(463 40)" fill="none" stroke="#B66E5D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
