    <circle cx="463" cy="40" r="29" fill="#FFFFFF" opacity=".48"/>
    <g transform="translate(463 40)" fill="none" stroke="#B96F4D" stroke-width="2.4" stroke-linecap="round">
      <path d="M-10 -4 L-21 -13 M10 -4 L21 -13 M-10 4 L-21 13 M10 4 L21 13"/>
      <rect x="-10" y="-7" width="20" height="14" rx="4" fill="#FFF8F0"/>
      <ellipse cx="-24" cy="-15" rx="7" ry="3"/><ellipse cx="24" cy="-15" rx="7" ry="3"/>
      <ellipse cx="-24" cy="15" rx="7" ry="3"/><ellipse cx="24" cy="15" rx="7" ry="3"/>
    </g>
    <text x="26" y="34" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#A66A4D">01  /  UAV NAVIGATION</text>
    <text x="26" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700" fill="#493D34">无人机视觉语言导航</text>
    <text x="26" y="108" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#9B674C">UAV Vision-Language Navigation</text>
