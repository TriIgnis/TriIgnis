<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">研究兴趣</title>
  <desc id="desc">六张暖色系研究方向卡片：无人机视觉语言导航、具身智能与机器人、多模态智能体、视觉语言动作模型、强化学习、运动控制。</desc>
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1E5"/><stop offset="1" stop-color="#F7DFCB"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0F1E7"/><stop offset="1" stop-color="#E1E6D7"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF6D9"/><stop offset="1" stop-color="#F5E8B9"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBE9E4"/><stop offset="1" stop-color="#F1D5CB"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7E9D9"/><stop offset="1" stop-color="#EBD4B9"/></linearGradient>
