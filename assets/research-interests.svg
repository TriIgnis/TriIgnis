    <text x="26" y="108" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#71866E">Motion Control</text>
    <text x="26" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#667260">运动规划 · 控制 · 运动技能学习</text>
