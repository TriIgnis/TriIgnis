  </g>

  <!-- Card 05 -->
  <g transform="translate(12 388)">
    <rect width="526" height="170" rx="18" fill="url(#c5)" stroke="#E3CFB7"/>
    <circle cx="463" cy="40" r="29" fill="#FFFFFF" opacity=".5"/>
    <g transform="translate(463 40)" fill="none" stroke="#A77A4D" stroke-width="2.4">
      <circle r="19"/><circle r="11"/><circle r="3.5" fill="#C97952" stroke="none"/>
      <path d="M0 -24 V-15 M0 15 V24 M-24 0 H-15 M15 0 H24" stroke-linecap="round"/>
    </g>
    <text x="26" y="34" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#9C754C">05  /  REINFORCEMENT LEARNING</text>
    <text x="26" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700" fill="#514235">强化学习</text>
    <text x="26" y="108" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#9C754C">Reinforcement Learning (RL)</text>
    <text x="26" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#776553">策略学习 · 智能决策 · 交互式学习</text>
  </g>

  <!-- Card 06 -->
  <g transform="translate(562 388)">
    <rect width="526" height="170" rx="18" fill="url(#c6)" stroke="#CDD9CA"/>
    <circle cx="463" cy="40" r="29" fill="#FFFFFF" opacity=".52"/>
    <g transform="translate(463 40)" fill="none" stroke="#71866E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-20 16 C-7 16 -10 -15 3 -15 S13 10 22 -7"/>
