    <text x="26" y="34" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#A66B5A">04  /  VISION-LANGUAGE-ACTION</text>
    <text x="26" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700" fill="#513F3B">视觉-语言-动作模型</text>
    <text x="26" y="108" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#A66B5A">Vision-Language-Action (VLA)</text>
