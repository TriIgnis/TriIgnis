<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
  <title id="title">TriIgnis GitHub 数据统计</title>
  <desc id="desc">暖色风格的 GitHub 数据卡片，展示公开仓库、累计 Stars、累计 Forks 和关注者数量，每日自动更新。</desc>
  <rect x="4" y="4" width="1092" height="222" rx="24" fill="#FFF9F2" stroke="#E8D7C6" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="34" y="38" font-size="12" font-weight="700" letter-spacing="2.4" fill="#A66A4D">GITHUB SNAPSHOT</text>
    <text x="1064" y="38" font-size="11" text-anchor="end" letter-spacing="1.2" fill="#A28E7C">UPDATED 2026-11-21 UTC</text>
    
    <g transform="translate(24 55)">
      <rect width="250" height="145" rx="17" fill="#FFFCF7" stroke="#EADBCB"/>
      <circle cx="218" cy="28" r="7" fill="#C97952" opacity=".25"/>
      <text x="22" y="35" font-size="11" font-weight="700" letter-spacing="1.1" fill="#A66A4D">PUBLIC REPOSITORIES</text>
      <text x="22" y="91" font-size="38" font-weight="750" fill="#453B34">3</text>
      <rect x="22" y="112" width="44" height="4" rx="2" fill="#C97952"/>
      <text x="22" y="133" font-size="12" fill="#8A7868">公开仓库</text>
    </g>
    <g transform="translate(292 55)">
      <rect width="250" height="145" rx="17" fill="#FFFCF7" stroke="#EADBCB"/>
      <circle cx="218" cy="28" r="7" fill="#E6AC59" opacity=".25"/>
      <text x="22" y="35" font-size="11" font-weight="700" letter-spacing="1.1" fill="#A8843F">TOTAL STARS</text>
      <text x="22" y="91" font-size="38" font-weight="750" fill="#453B34">2</text>
      <rect x="22" y="112" width="44" height="4" rx="2" fill="#E6AC59"/>
      <text x="22" y="133" font-size="12" fill="#8A7868">累计 Stars</text>
    </g>
    <g transform="translate(560 55)">
      <rect width="250" height="145" rx="17" fill="#FFFCF7" stroke="#EADBCB"/>
      <circle cx="218" cy="28" r="7" fill="#89947B" opacity=".25"/>
      <text x="22" y="35" font-size="11" font-weight="700" letter-spacing="1.1" fill="#78866B">TOTAL FORKS</text>
      <text x="22" y="91" font-size="38" font-weight="750" fill="#453B34">0</text>
      <rect x="22" y="112" width="44" height="4" rx="2" fill="#89947B"/>
      <text x="22" y="133" font-size="12" fill="#8A7868">累计 Forks</text>
    </g>
    <g transform="translate(828 55)">
      <rect width="250" height="145" rx="17" fill="#FFFCF7" stroke="#EADBCB"/>
      <circle cx="218" cy="28" r="7" fill="#D99A70" opacity=".25"/>
      <text x="22" y="35" font-size="11" font-weight="700" letter-spacing="1.1" fill="#A66A4D">FOLLOWERS</text>
      <text x="22" y="91" font-size="38" font-weight="750" fill="#453B34">2</text>
      <rect x="22" y="112" width="44" height="4" rx="2" fill="#D99A70"/>
      <text x="22" y="133" font-size="12" fill="#8A7868">关注者</text>
    </g>
  </g>
</svg>
