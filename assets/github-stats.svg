<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="205" viewBox="0 0 1100 205" role="img" aria-labelledby="title desc">
  <title id="title">TriIgnis GitHub 数据统计</title>
  <desc id="desc">暖色风格的 GitHub 数据统计，展示公开仓库、累计 Stars、累计 Forks 和关注者数量，每日自动更新。</desc>
  <rect x="4" y="4" width="1092" height="197" rx="26" fill="#FFF9F2" stroke="#EFE2D4" stroke-width="1.4"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="34" y="36" font-size="11" font-weight="700" letter-spacing="2.1" fill="#A66A4D">GITHUB SNAPSHOT</text>
    <text x="1064" y="36" font-size="10.5" text-anchor="end" letter-spacing="1" fill="#A28E7C">UPDATED 2026-11-28 UTC</text>
    <path d="M280 58 V184 M550 58 V184 M820 58 V184" stroke="#EDE2D7" stroke-width="1"/>
    
    <g transform="translate(145 0)">
      <circle cx="-78" cy="76" r="4" fill="#C97952" opacity=".9"/>
      <text x="0" y="81" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.25" fill="#927B68">PUBLIC REPOSITORIES</text>
      <text x="0" y="132" text-anchor="middle" font-size="38" font-weight="750" fill="#453B34">3</text>
      <rect x="-16" y="151" width="32" height="3" rx="1.5" fill="#C97952" opacity=".75"/>
      <text x="0" y="180" text-anchor="middle" font-size="12" fill="#8A7868">公开仓库</text>
    </g>
    <g transform="translate(415 0)">
      <circle cx="-78" cy="76" r="4" fill="#D6A45F" opacity=".9"/>
      <text x="0" y="81" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.25" fill="#927B68">TOTAL STARS</text>
      <text x="0" y="132" text-anchor="middle" font-size="38" font-weight="750" fill="#453B34">2</text>
      <rect x="-16" y="151" width="32" height="3" rx="1.5" fill="#D6A45F" opacity=".75"/>
      <text x="0" y="180" text-anchor="middle" font-size="12" fill="#8A7868">累计 Stars</text>
    </g>
    <g transform="translate(685 0)">
      <circle cx="-78" cy="76" r="4" fill="#89947B" opacity=".9"/>
      <text x="0" y="81" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.25" fill="#927B68">TOTAL FORKS</text>
      <text x="0" y="132" text-anchor="middle" font-size="38" font-weight="750" fill="#453B34">0</text>
      <rect x="-16" y="151" width="32" height="3" rx="1.5" fill="#89947B" opacity=".75"/>
      <text x="0" y="180" text-anchor="middle" font-size="12" fill="#8A7868">累计 Forks</text>
    </g>
    <g transform="translate(955 0)">
      <circle cx="-78" cy="76" r="4" fill="#C58C70" opacity=".9"/>
      <text x="0" y="81" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.25" fill="#927B68">FOLLOWERS</text>
      <text x="0" y="132" text-anchor="middle" font-size="38" font-weight="750" fill="#453B34">2</text>
      <rect x="-16" y="151" width="32" height="3" rx="1.5" fill="#C58C70" opacity=".75"/>
      <text x="0" y="180" text-anchor="middle" font-size="12" fill="#8A7868">关注者</text>
    </g>
  </g>
</svg>
